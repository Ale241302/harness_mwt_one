# The native product-module bundle patch: mounts the product service rows and
# their model tools over the Web surface. The `faberloom` profile composes it
# after `@deepseek-ai/dsh-base` and `@deepseek-ai/dsh-web-app`, so the served
# harness carries the product modules as first-class rows.

- insert:
    - id: faberloom-spaces
      name: '@deepseek-ai/dsh-faberloom-spaces'

    - id: faberloom-agents
      name: '@deepseek-ai/dsh-faberloom-agents'

    # Plano de capacidades del agente: convierte mwtMcp/sicopMcp/webAccess en un
    # filtro real del plano de tools del agente (hijo delegado y sesión del Space).
    - id: faberloom-agent-plane
      name: '@deepseek-ai/dsh-faberloom-agent-plane'

    # La sesión de un Space corre como su agente responsable (persona/plano/skills).
    - id: faberloom-session-agent
      name: '@deepseek-ai/dsh-faberloom-session-agent'

    # Consultas durables con el agente de un Space (ask continuable + follow-up).
    - id: faberloom-agent-runtime
      name: '@deepseek-ai/dsh-faberloom-agent-runtime'

    # Índice de búsqueda del Space: embeddings + Knowledge Hub + fallback léxico
    # sobre título, contexto, entradas curadas, memoria y texto de adjuntos.
    - id: faberloom-knowledge-index
      name: '@deepseek-ai/dsh-faberloom-knowledge-index'

    # Catálogo de modelos dinámico: tabla de proveedores, descubrimiento de
    # modelos con una credencial nombrada y sonda de credencial/cuota.
    - id: faberloom-model-catalog
      name: '@deepseek-ai/dsh-faberloom-model-catalog'

    # User-owned MCP servers: durable configuration, credential-seam secrets,
    # the install probe, and the process-global mounts of every enabled server.
    - id: faberloom-mcp-registry
      name: '@deepseek-ai/dsh-faberloom-mcp-registry'

    - id: faberloom-board
      name: '@deepseek-ai/dsh-faberloom-board'

    - id: faberloom-routines
      name: '@deepseek-ai/dsh-faberloom-routines'

    # Grafos de trabajo versionados compilados a rutinas; el motor los ejecuta.
    - id: faberloom-workflows
      name: '@deepseek-ai/dsh-faberloom-workflows'

    # Compartir Spaces y Work Flows con permisos, aviso por correo y consola.
    - id: faberloom-shares
      name: '@deepseek-ai/dsh-faberloom-shares'

    # Contexto del Workspace/Space: versionado y con aprobación del dueño.
    - id: faberloom-context
      name: '@deepseek-ai/dsh-faberloom-context'

    # Sesiones compartidas del Space: capturadas por cada miembro y sincronizadas por la consola.
    - id: faberloom-session-shares
      name: '@deepseek-ai/dsh-faberloom-session-shares'

    - id: faberloom-execution
      name: '@deepseek-ai/dsh-faberloom-execution'

    # Recepcion de correo del buzon del usuario (IMAP configurado en Conexiones).
    - id: faberloom-inbound
      name: '@deepseek-ai/dsh-faberloom-inbound'

    # Servidor MCP propio: otra IA lee y gestiona el trabajo del owner.
    - id: faberloom-mcp-server
      name: '@deepseek-ai/dsh-faberloom-mcp-server'

    # Los servicios de memoria y autonomía siguen montados (ctx.faberloomMemory /
    # ctx.faberloomAccess), pero sus tools ya no se registran: la capa de memoria
    # del agente la aporta TencentDB Agent Memory vía el proxy del modelo.
    - id: faberloom-learning
      name: '@deepseek-ai/dsh-faberloom-learning'

    - id: faberloom-access
      name: '@deepseek-ai/dsh-faberloom-access'

    - id: faberloom-backup
      name: '@deepseek-ai/dsh-faberloom-backup'

    # Mirror entre este equipo y el despliegue: lee el documento versionado del
    # gateway y aplica las filas y los archivos de skills, y empuja los cambios
    # locales con retardo. Queda inerte hasta que el despliegue lo enciende
    # (FABERLOOM_MIRROR_ENABLED=1) y nombra su credencial
    # (FABERLOOM_MIRROR_URL y FABERLOOM_MIRROR_KEY); sin ellas el servidor MCP
    # no acepta ninguna llamada de espejo y la bitácora lo dice. `disabled`
    # decide si la fila se monta y `config.enabled` que el servicio lo sepa:
    # sin el segundo, el servicio se monta y se declara apagado.
    - id: faberloom-mirror
      name: '@deepseek-ai/dsh-faberloom-mirror'
      disabled: !!js process.env.FABERLOOM_MIRROR_ENABLED !== '1'
      config:
        enabled: !!js process.env.FABERLOOM_MIRROR_ENABLED === '1'

    # Proyeccion del harness de un ambito: escribe en la carpeta del Workspace o
    # del Espacio lo que ese ambito ha usado (agentes, skills, flujos, rutinas,
    # memoria y contexto) con la disposicion que leen los CLI —AGENTS.md,
    # CLAUDE.md, GEMINI.md y los directorios .agents/, .claude/, .gemini/ y
    # .kimi-code/— y poda lo suyo. El panel del Espacio la dispara.
    - id: faberloom-harness-projection
      name: '@deepseek-ai/dsh-faberloom-harness-projection'
      config:
        enabled: true

    # Conexiones propias del usuario (IMAP y respaldo), ajenas al MCP.
    - id: faberloom-connections
      name: '@deepseek-ai/dsh-faberloom-connections'

    # Implementacion de los handlers de paso que declaran las rutinas.
    - id: faberloom-handlers
      name: '@deepseek-ai/dsh-faberloom-handlers'

    # Siembra inicial de agentes y rutinas (una vez por owner).
    - id: faberloom-defaults
      name: '@deepseek-ai/dsh-faberloom-defaults'

    # Read-only workspace view the browser panels read.
    - id: faberloom-view
      name: '@deepseek-ai/dsh-faberloom-view'

    # The model-facing product tools over the mounted services. The explicit
    # Space-memory tools are on so the prompt's `faberloom_spaces_remember`
    # instruction resolves instead of failing as an unknown tool.
    - id: tool-faberloom
      name: '@deepseek-ai/dsh-tool-faberloom'
      config:
        memoryTools: true
        workflowTools: true
        contextTools: true

    # The FaberLoom browser surface: identity tokens plus the global panels.
    - id: ui-faberloom
      name: '@deepseek-ai/dsh-client-ui-faberloom'

# The product's Skills panel installs through `ctx.skillInstall`, so the host
# instance must exist here even though `web-app` disables the base row and the
# shipped presets carry their own (their tools shadow this global pair). See
# `.agents/notes/implemented/feature/2026-10-13-one-native-skill-install-path.md`.
- id: skill-install
  disabled: false

# The Settings modal is the product's home for theme, language and provider
# credentials. This composition mounts the Models page so a desktop installation
# can enter OpenAI, Anthropic, Google, Moonshot or DeepSeek keys without editing
# `.env`; the environment defaults still win only when no credential is stored.
# The archived-sessions page stays out of the product.
- id: ui-settings-models
  disabled: false
- id: ui-settings-unarchive-sessions
  disabled: true

# Política FaberLoom: toda consulta va por el MCP de MWT.ONE. Se retiran las
# herramientas de internet para que el modelo no traiga datos de fuera.
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true

# Rutas multi-proveedor por defecto del producto. El adaptador pi-ai ya viene
# montado (dormido) en el bundle base; aquí se le dan los perfiles para que
# OpenAI, Anthropic, Google, Kimi (plan de código) y Moonshot (plataforma)
# existan como rutas en todo arranque de este perfil —el gateway y la app de
# escritorio—, no solo cuando un despliegue las escribe. `apiKeyEnv` es una
# referencia a la variable de entorno que resuelve la credencial en cada
# request; la clave propia de un agente (GenerateOptions.credentialRef) siempre
# gana sobre esta referencia. La clave nunca va en el repo: sin valor, la ruta
# queda sin credencial.
#
# `kimi` es el plan de código (Anthropic Messages en https://api.kimi.com/coding).
# Ese proveedor no publica endpoint de modelos (404), así que su lista —`k3`,
# `k3-256k`, `kimi-for-coding`, `kimi-for-coding-highspeed`— viene del catálogo
# instalado de pi-ai, no del descubrimiento. `moonshotai` es la plataforma
# Moonshot (OpenAI-compatible en https://api.moonshot.ai/v1), un producto
# distinto con credenciales distintas.
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      google:
        apiKeyEnv: GOOGLE_API_KEY
      kimi:
        apiKeyEnv: KIMI_API_KEY
      moonshotai:
        apiKeyEnv: MOONSHOT_API_KEY
