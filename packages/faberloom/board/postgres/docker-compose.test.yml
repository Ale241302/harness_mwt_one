name: mesa-postgres-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa_admin
      POSTGRES_PASSWORD: mesa_admin_test
    ports:
      - "55432:5432"
    volumes:
      - ./schema.sql:/mesa/schema.sql:ro
      - ./docker/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa_admin -d mesa"]
      interval: 2s
      timeout: 3s
      retries: 30
