# Keyless replay counterpart of space-ask-agent/cordis.yml: the model script
# comes from the committed session JSONL, and the fixture registers the fake
# spaces/agents services plus the `snapshot` subagent provider.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

    - id: space-ask-fixture
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/space-ask-fixture.ts'

    - id: tool-faberloom
      name: '@deepseek-ai/dsh-tool-faberloom'
      config:
        ownerId: snapshot@muitowork.com
        role: admin
        companyId: co-snapshot
        companyIds: [co-snapshot]
        readOnly: false
        mcpUrl: http://127.0.0.1:1/mcp
        mcpGatewayKey: snapshot
        askProvider: snapshot
