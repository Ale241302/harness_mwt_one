# Publish the interactive Archify diagrams to GitHub Pages.
#
# This is a small, self-contained site: the committed `.archify/**/*.html`
# artifacts plus the landing page at `.archify/index.html`. It reuses the same
# Pages pipeline as docs-pages.yml (configure-pages -> upload-pages-artifact ->
# deploy-pages) but runs on main pushes that touch the diagrams, and never
# publishes the JSON sources or verification sidecars.
name: Deploy Archify diagrams

on:
  push:
    branches: [main]
    paths:
      - '.archify/**'
      - '.github/workflows/archify-pages.yml'
  workflow_dispatch:

concurrency:
  group: archify-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Serve only the rendered diagrams and the landing page; drop candidate
      # JSON and verification receipts so the site stays lean.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R .archify/. _site/
          find _site -type f -name '*.json' -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
