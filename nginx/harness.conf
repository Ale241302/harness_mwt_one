# =====================================================================
# Harness MWT · harness.conf
# Server block de nginx para https://harness.mwt.one
#
# Se MONTA dentro del contenedor `mwt-nginx` (el que tiene 80/443 en el VPS).
# OJO: es un bind-mount de ARCHIVO; editarlo desde el host con herramientas
# que reemplazan el inodo (p. ej. `sed -i` o `docker cp`) puede no reflejarse
# en el contenedor. Aplicar en caliente desde dentro del contenedor:
#   docker exec mwt-nginx sh -c 'base64 -d > /etc/nginx/conf.d/harness.conf' <<< <b64>
# y luego:
#   docker exec mwt-nginx nginx -t && docker exec mwt-nginx nginx -s reload
#
# TLS: reusa el cert de /etc/nginx/ssl/ del mwt-nginx (Cloudflare Full).
# =====================================================================

upstream harness_gateway {
    server harness-gateway:8080;
}

# E1 · rate limit de login por IP real del cliente (Cloudflare -> CF-Connecting-IP).
map $http_cf_connecting_ip $rl_login_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $rl_login_client zone=harness_login:10m rate=12r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harness.mwt.one;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    client_max_body_size 320M;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # E1 · login con rate limit (GET formulario y POST credenciales).
    location = /login {
        limit_req zone=harness_login burst=6 nodelay;
        proxy_pass http://harness_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://harness_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }
}
