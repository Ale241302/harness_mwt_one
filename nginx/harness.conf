# =====================================================================
# Harness MWT · harness.conf
# Server block de nginx para https://harness.mwt.one
#
# Se MONTA dentro del contenedor `mwt-nginx` (el que tiene 80/443 en el
# VPS). Para que resuelva `harness-gateway`, conecta esa red:
#
#     docker network connect harness-net mwt-nginx
#
# Despliegue en caliente:
#     docker cp /opt/harness-mwt-one/nginx/harness.conf mwt-nginx:/etc/nginx/conf.d/harness.conf
#     docker exec mwt-nginx nginx -t
#     docker exec mwt-nginx nginx -s reload
#
# TLS: reusa el cert de /etc/nginx/ssl/ del mwt-nginx (Cloudflare Full).
# =====================================================================

upstream harness_gateway {
    server harness-gateway:8080;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harness.mwt.one;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # dsh acepta hasta 300 MiB de body para imágenes/RPC; damos margen.
    client_max_body_size 320M;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://harness_gateway;
        proxy_http_version 1.1;

        # Host debe llegar como harness.mwt.one: el trust fence de dsh lo
        # exige (necesita estar en --trusted-host) y la cookie de dsh se
        # firma contra esa autoridad. Origin (mismo host) también coincide.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (/api/remote.mux) y streaming.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }
}
