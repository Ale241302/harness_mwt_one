<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="startup.css">
  </head>
  <body>
    <button id="appearance-toggle" type="button" aria-label="">
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"></path>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path>
      </svg>
    </button>
    <div id="language" role="group"></div>
    <main aria-busy="true">
      <h1 id="title"><span id="wordmark-faber">Faber</span><span id="wordmark-loom">Loom</span></h1>
      <section id="status" class="card" hidden>
        <h2 id="heading" role="status" aria-live="polite"></h2>
        <div id="spinner" aria-hidden="true"></div>
        <p id="description"></p>
        <p id="reset-advice" hidden></p>
        <p id="reinstall-advice" hidden></p>
        <pre id="error" role="alert" hidden></pre>
        <div id="actions" hidden>
          <button id="restart" type="button"></button>
          <button id="disable-plugins" type="button"></button>
          <button id="reset-configuration" type="button"></button>
        </div>
      </section>
      <form id="signin" class="card" hidden>
        <p id="signin-description"></p>
        <label for="signin-user" id="signin-user-label"></label>
        <input id="signin-user" name="usuario" type="text" autocomplete="username" required>
        <label for="signin-password" id="signin-password-label"></label>
        <span class="secret">
          <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" id="signin-password-toggle" aria-pressed="false">
            <svg class="icon icon-eye" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 8s2.4-4 6.5-4 6.5 4 6.5 4-2.4 4-6.5 4-6.5-4-6.5-4Z"></path>
              <circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
            </svg>
            <svg class="icon icon-eye-off" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
              <path fill="none" stroke="currentColor" stroke-width="1.3" d="M1.5 8s2.4-4 6.5-4 6.5 4 6.5 4-2.4 4-6.5 4-6.5-4-6.5-4Z"></path>
              <circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
              <path fill="none" stroke="currentColor" stroke-width="1.3" d="M3 13 13 3"></path>
            </svg>
          </button>
        </span>
        <button id="signin-submit" type="submit"><span id="signin-submit-spinner" class="button-spinner" aria-hidden="true" hidden></span><span id="signin-submit-label"></span></button>
        <p id="signin-error" role="alert" hidden></p>
        <button id="signin-forgot" class="link" type="button"></button>
      </form>
    </main>
    <dialog id="recovery">
      <form id="recovery-form">
        <h2 id="recovery-title"></h2>
        <p id="recovery-description"></p>
        <label for="recovery-email" id="recovery-email-label"></label>
        <input id="recovery-email" name="email" type="email" autocomplete="email" required>
        <p id="recovery-error" role="alert" hidden></p>
        <p id="recovery-sent" role="status" hidden></p>
        <div id="recovery-actions">
          <button type="button" id="recovery-close"></button>
          <button type="submit" id="recovery-submit"></button>
        </div>
      </form>
    </dialog>
    <script src="startup.js"></script>
  </body>
</html>
