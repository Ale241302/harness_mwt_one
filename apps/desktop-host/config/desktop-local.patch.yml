# Applied last by the Desktop host when FABERLOOM_LOCAL=1. The local composition
# never mounts the deployment's credential console, checks, mirror, shares,
# session sync, inbound mail, or publication service. The local identity patch
# (rewritten on every local launch) keeps the loopback MCP endpoint with its
# outbound bridge off; this overlay only disables the rows it would otherwise
# remount. It deliberately does not patch the MCP server config: a config override
# replaces the whole object and would drop ownerId, enabled, socketPath, and
# publicationRepo.

- id: credentials-console
  disabled: true

- id: faberloom-checks-mwt
  disabled: true

- id: faberloom-mirror
  disabled: true

- id: faberloom-shares
  disabled: true

- id: faberloom-session-shares
  disabled: true

- id: faberloom-inbound
  disabled: true

- id: faberloom-publication
  disabled: true
