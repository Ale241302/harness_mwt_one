# Applied last by the Desktop host when FABERLOOM_LOCAL=1. The local composition
# never mounts the deployment's credential console, checks, mirror, shares,
# session sync, inbound mail, or publication service, and keeps the loopback MCP
# endpoint without its outbound bridge. The bundle gates the same rows first; this
# overlay also protects a home whose identity patch predates the local mode.

- id: credentials-console
  disabled: true

- id: faberloom-checks-mwt
  disabled: true

- id: faberloom-mirror
  disabled: true

- id: faberloom-shares
  disabled: true

- id: faberloom-session-shares
  disabled: true

- id: faberloom-inbound
  disabled: true

- id: faberloom-publication
  disabled: true

- id: faberloom-mcp-server
  config:
    bridge: false
    gatewayUrl: ''
    consoleBase: ''
